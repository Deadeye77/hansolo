      - name: Configure and test RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          # Set runner password
          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $password

          # Enable RDP
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Require Network Level Authentication
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Enable Windows Firewall RDP rules
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          # Start Remote Desktop service
          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService"

          Write-Host ""
          Write-Host "=== RDP SERVICE ==="
          Get-Service TermService | Format-Table Name, Status, StartType

          Write-Host ""
          Write-Host "=== RDP LISTENER ==="
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=== FIREWALL ==="
          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Where-Object Enabled -eq "True" |
            Format-Table DisplayName, Profile, Direction, Action

          Write-Host ""
          Write-Host "RDP configuration complete."
