      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |
          $ErrorActionPreference = "Stop"

          # Verify the GitHub secret exists
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing or empty. Check GitHub repository Actions secrets."
          }

          # Find the Windows account
          $user = Get-LocalUser -Name "runneradmin"

          if (-not $user) {
            throw "runneradmin account not found."
          }

          # Set the password
          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $password

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP configured successfully."
